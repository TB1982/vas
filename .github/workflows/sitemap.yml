name: Check sitemap & consistency

# check-only：在 PR 階段重跑產生器，跟分支裡已提交的 sitemap.xml 比對。
#   一致 → 綠燈通過（正常情況：改頁面時已在本地跑產生器、放進同一個 commit）
#   不一致 → 紅燈提醒「sitemap 沒更新到」——此時請在本地跑
#            python3 tools/gen_sitemap.py，把結果 commit 進同一個變更再推。
# CI 不再自行 commit／push（避免產生沒趕上 merge 的孤兒 commit，也避免
# CI 端 git 歷史與 main 不一致時算出錯誤日期）。lastmod 由 git 決定。

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-sitemap:
    runs-on: ubuntu-latest
    # 只檢查同 repo 的 PR
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR branch (full history for git-derived lastmod)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify sitemap is up to date
        run: python3 tools/gen_sitemap.py --check

      # 矩陣稽核：把「頁×語系」網格當單位，抓共用元件(頁首/頁尾)漂移、
      # es 跨頁連結衛生、以及章名跨槽位(echo TOC vs passage-nav)的時序翻譯漂移。
      # 綠燈＝五語系一致；紅燈＝某處漂了，訊息會直指是哪語系哪頁哪族。
      - name: Verify matrix consistency (chrome / links / codenames)
        run: python3 tools/matrix_audit.py
